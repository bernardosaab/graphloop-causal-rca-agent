name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check (strict)
        run: uv run mypy src
      - name: Tests, eval release gates and coverage
        run: uv run pytest --cov --cov-report=xml
      - name: Benchmark (simulated model, deterministic)
        run: uv run graphloop bench --scenarios 60 --seed 7 --out ci-results
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: ci-results/
