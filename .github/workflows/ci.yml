name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check (strict)
        run: uv run mypy src
      - name: Tests, eval release gates and coverage
        run: uv run pytest --cov --cov-report=xml
      - name: Benchmark (simulated model, deterministic)
        run: uv run graphloop bench --scenarios 60 --seed 7 --out ci-results
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: ci-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test suite inside the image
        run: docker build --target test -t graphloop:test .
      - name: Build runtime image
        run: docker build -t graphloop:ci .
      - name: Smoke test (non-root runtime)
        run: |
          docker run --rm graphloop:ci run --incident 3 --agent graph+memory
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/app/out" graphloop:ci bench --scenarios 6 --out out
          test -f out/report.html
