[project]
name = "graphloop"
version = "0.1.0"
description = "Graph engineering meets loop engineering: a Causal Context Graph agent with embedded verification loops for incident root-cause analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "graphloop contributors" }]
keywords = ["agents", "langgraph", "causal-graph", "context-graph", "root-cause-analysis", "llm"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=0.2.60",
    "networkx>=3.3",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
graphloop = "graphloop.cli.app:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-networkx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphloop"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PL", "PT", "C4", "TID", "ARG"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "ollama: requires a running local Ollama server (skipped by default)",
]

[tool.coverage.run]
source = ["graphloop"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
